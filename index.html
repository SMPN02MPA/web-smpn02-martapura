<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMP Negeri 02 Martapura - Portal Resmi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    #netlify-badge, 
    a[href*="netlify.com"][style*="fixed"] { 
      display: none !important; 
    }
    
    .profil-gallery::-webkit-scrollbar { height: 6px; }
    .profil-gallery::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadeInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    
    .anim-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-down { animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-left { animation: fadeInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-right { animation: fadeInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-zoom { animation: zoomIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-400 { animation-delay: 400ms; }
    .opacity-0-init { opacity: 0; }
  </style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50 text-slate-800">
  
  <!-- Overlay Layar (Berlaku untuk semua layar saat sidebar dibuka) -->
  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden"></div>
  
  <!-- Sidebar Navigasi (Sembunyi secara default / Tergeser ke kiri penuh) -->
  <aside id="sidebar-menu" class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900 text-slate-300 flex flex-col transition-transform duration-300 ease-in-out -translate-x-full shadow-2xl">
    <div class="pt-8 pb-6 px-6 flex items-center gap-3.5 border-b border-slate-800/80 relative">
      <!-- Tombol Tutup Silang di Dalam Sidebar -->
      <button onclick="toggleSidebar()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition w-8 h-8 flex items-center justify-center bg-slate-800 rounded-full">
        <i class="fas fa-times"></i>
      </button>

      <img id="school-logo" src="assets/LOGO SMPN02MPA VERSI 2.png" alt="Logo SMPN 02 Martapura" class="w-12 h-12 object-contain flex-shrink-0 bg-white/5 rounded-xl p-1" />
      <div class="overflow-hidden">
        <h2 id="school-short-name" class="text-base font-bold tracking-wide text-white truncate">SMPN 02 MPA</h2>
        <p id="school-full-name" class="text-[11px] text-slate-400 leading-tight">SMP Negeri 02 Martapura</p>
      </div>
    </div>
    
    <div class="px-5 py-4 border-b border-slate-800/80">
      <div class="bg-slate-800/70 rounded-xl px-3.5 py-2.5 flex items-center gap-2.5 border border-slate-700/50 focus-within:border-indigo-500 transition">
        <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
        <input id="searchInput" type="text" onkeyup="handleSearch(this.value)" placeholder="Cari data, guru, prestasi..." class="bg-transparent text-xs text-white placeholder-slate-400 focus:outline-none w-full" />
      </div>
    </div>
    
    <nav class="flex-1 px-4 py-5 space-y-1.5 overflow-y-auto sidebar-scroll text-sm">
      <button onclick="navigate('beranda')" data-nav="beranda" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium transition text-left bg-indigo-600 text-white shadow-lg shadow-indigo-600/20">
        <i class="fas fa-home w-5 text-center"></i>
        <span>Beranda</span>
      </button>
      <button onclick="navigate('profil')" data-nav="profil" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition text-left">
        <i class="fas fa-school w-5 text-center"></i>
        <span>Profil Sekolah</span>
      </button>
      
      <div>
        <button onclick="toggleDropdown('dropdown-ptk', 'arrow-ptk')" data-parent="ptk" class="parent-nav w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <div class="flex items-center gap-3">
            <i class="fas fa-chalkboard-teacher w-5 text-center"></i>
            <span>PTK</span>
          </div>
          <i id="arrow-ptk" class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
        </button>
        <div id="dropdown-ptk" class="hidden pl-9 pr-2 pt-1 space-y-1">
          <button onclick="navigate('ptk-guru')" data-nav="ptk-guru" data-parent-ref="ptk" class="nav-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/70 transition">Guru</button>
          <button onclick="navigate('ptk-admin')" data-nav="ptk-admin" data-parent-ref="ptk" class="nav-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/70 transition">Tenaga Administrasi</button>
        </div>
      </div>
      
      <div>
        <button onclick="toggleDropdown('dropdown-siswa', 'arrow-siswa')" data-parent="siswa" class="parent-nav w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <div class="flex items-center gap-3">
            <i class="fas fa-user-graduate w-5 text-center"></i>
            <span>Siswa</span>
          </div>
          <i id="arrow-siswa" class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
        </button>
        <div id="dropdown-siswa" class="hidden pl-9 pr-2 pt-1 space-y-1">
          <button onclick="navigate('siswa-data')" data-nav="siswa-data" data-parent-ref="siswa" class="nav-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/70 transition">Data & Rombel</button>
          <button onclick="navigate('siswa-pencapaian')" data-nav="siswa-pencapaian" data-parent-ref="siswa" class="nav-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/70 transition">Pencapaian</button>
        </div>
      </div>
      
      <div>
        <button onclick="toggleDropdown('dropdown-ekskul', 'arrow-ekskul')" data-parent="ekskul" class="parent-nav w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <div class="flex items-center gap-3">
            <i class="fas fa-trophy w-5 text-center"></i>
            <span>Ekstrakurikuler</span>
          </div>
          <i id="arrow-ekskul" class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
        </button>
        <div id="dropdown-ekskul" class="hidden pl-9 pr-2 pt-1 space-y-1">
          <button onclick="navigate('ekskul-daftar')" data-nav="ekskul-daftar" data-parent-ref="ekskul" class="nav-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/70 transition">Daftar & Kegiatan</button>
          <button onclick="navigate('ekskul-pencapaian')" data-nav="ekskul-pencapaian" data-parent-ref="ekskul" class="nav-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/70 transition">Pencapaian</button>
        </div>
      </div>
      
      <button onclick="navigate('pengumuman')" data-nav="pengumuman" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition text-left">
        <i class="fas fa-bullhorn w-5 text-center"></i>
        <span>Pengumuman</span>
      </button>
    </nav>
  </aside>
  
  <!-- Main Content Area (Full Lebar Layar) -->
  <main id="main-content" class="flex-1 flex flex-col min-w-0 transition-all duration-300 ease-in-out relative overflow-hidden w-full">
    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200/80 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-4">
        <!-- Tombol Hamburger Selalu Tampil -->
        <button onclick="toggleSidebar()" class="flex w-10 h-10 items-center justify-center rounded-xl bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
          <i class="fas fa-bars text-lg"></i>
        </button>
        <div>
          <h1 id="page-title" class="text-lg font-bold text-slate-800">Beranda</h1>
          <p class="text-xs text-slate-500 hidden sm:block">Sistem Informasi & Profil SMP Negeri 02 Martapura</p>
        </div>
      </div>
      <div class="hidden sm:flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3.5 py-1.5 rounded-full text-xs font-medium">
        <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
        <span>Tahun Ajaran 2026/2027</span>
      </div>
    </header>
    
    <!-- Dynamic Page Container -->
    <div id="app-content" class="flex-1 overflow-y-auto p-6 lg:p-8 space-y-6 w-full max-w-7xl mx-auto">
      <!-- Konten dimuat otomatis oleh JavaScript -->
    </div>
  </main>
  
  <script>
    let siteData = {
      identitas: {
        nama: "SMP Negeri 02 Martapura",
        singkatan: "SMPN 02 MPA",
        logo: "assets/LOGO SMPN02MPA VERSI 2.png",
        sambutan: "Selamat datang di portal resmi SMP Negeri 02 Martapura. Temukan informasi akademik, kegiatan siswa, serta prestasi membanggakan dari keluarga besar sekolah kami."
      },
      pengumuman: [], guru: [], administrasi: [], prestasi_siswa: [], ekskul: []
    };
    
    let currentPage = 'beranda';
    
    async function loadSchoolData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        if (response.ok) {
          const json = await response.json();
          siteData = { ...siteData, ...json };
        }
      } catch (err) {
        console.log('Menggunakan data lokal awal.');
      }
      
      if (siteData.identitas) {
        document.getElementById('school-short-name').textContent = siteData.identitas.singkatan || 'SMPN 02 MPA';
        document.getElementById('school-full-name').textContent = siteData.identitas.nama || 'SMP Negeri 02 Martapura';
        if (siteData.identitas.logo) {
          document.getElementById('school-logo').src = siteData.identitas.logo;
        }
      }
      renderPage(currentPage);
    }
    
    function renderMediaEmbed(foto, videoUrl, altText) {
      let html = '';
      if (foto) html += `<img src="${foto}" alt="${altText}" class="w-full h-48 object-cover rounded-xl mb-4 bg-slate-100" />`;
      if (videoUrl) {
        let embedUrl = '';
        if (videoUrl.includes('youtube.com/watch?v=')) {
          embedUrl = `https://www.youtube.com/embed/${videoUrl.split('v=')[1].split('&')[0]}`;
        } else if (videoUrl.includes('youtu.be/')) {
          embedUrl = `https://www.youtube.com/embed/${videoUrl.split('youtu.be/')[1].split('?')[0]}`;
        }
        if (embedUrl) {
          html += `<div class="aspect-video w-full rounded-xl overflow-hidden mb-4 shadow-sm"><iframe class="w-full h-full" src="${embedUrl}" frameborder="0" allowfullscreen></iframe></div>`;
        } else if (videoUrl.endsWith('.mp4')) {
          html += `<video controls class="w-full rounded-xl mb-4"><source src="${videoUrl}" type="video/mp4"></video>`;
        }
      }
      return html;
    }
    
    function navigate(page) {
      currentPage = page;
      document.getElementById('searchInput').value = '';
      
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
        if (el.dataset.parentRef) el.classList.add('text-slate-400');
        else el.classList.add('text-slate-300');
      });
      document.querySelectorAll('.parent-nav').forEach(el => {
        el.classList.remove('text-indigo-400', 'bg-slate-800/60');
        el.classList.add('text-slate-300');
      });
      
      const activeBtn = document.querySelector(`[data-nav="${page}"]`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-300', 'text-slate-400');
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
        const parentRef = activeBtn.dataset.parentRef;
        if (parentRef) {
          const parentBtn = document.querySelector(`[data-parent="${parentRef}"]`);
          if (parentBtn) {
            parentBtn.classList.remove('text-slate-300');
            parentBtn.classList.add('text-indigo-400', 'bg-slate-800/60');
          }
        }
      }
      
      // Auto tutup sidebar setelah klik menu
      const sidebar = document.getElementById('sidebar-menu');
      const overlay = document.getElementById('sidebarOverlay');
      if (!sidebar.classList.contains('-translate-x-full')) {
          sidebar.classList.add('-translate-x-full');
          overlay.classList.add('hidden');
      }
      
      renderPage(page);
    }
    
    function scrollGallery(galleryId, direction) {
      const gallery = document.getElementById(galleryId);
      if (gallery) {
        gallery.scrollBy({ left: direction * 320, behavior: 'smooth' });
      }
    }
    
    function renderPage(page, filterKeyword = '') {
      const container = document.getElementById('app-content');
      const titleEl = document.getElementById('page-title');
      const kw = filterKeyword.toLowerCase();
      
      if (page === 'beranda') {
        titleEl.textContent = 'Beranda';
        const recentPengumuman = siteData.pengumuman.slice(0, 3);
        container.innerHTML = `
          <div class="animate-fade-in-up opacity-0-init space-y-6 anim-up">
            <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
              <div class="relative z-10 max-w-2xl space-y-4">
                <span class="inline-block px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-xs font-medium">Portal Digital Sekolah</span>
                <h2 class="text-2xl lg:text-3xl font-bold leading-snug">${siteData.identitas.nama}</h2>
                <p class="text-slate-300 text-sm leading-relaxed">${siteData.identitas.sambutan}</p>
                <div class="pt-2 flex flex-wrap gap-3">
                  <button onclick="navigate('ptk-guru')" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold transition shadow-lg shadow-indigo-600/30">Direktori Guru</button>
                  <button onclick="navigate('siswa-pencapaian')" class="px-5 py-2.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-semibold transition">Prestasi Siswa</button>
                </div>
              </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              <div class="bg-white p-6 rounded-2xl border border-slate-200/70 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg"><i class="fas fa-chalkboard-teacher"></i></div>
                <div>
                  <p class="text-xs text-slate-500">Tenaga Pendidik</p>
                  <p class="text-xl font-bold text-slate-800">${siteData.guru.length} Guru</p>
                </div>
              </div>
              <div class="bg-white p-6 rounded-2xl border border-slate-200/70 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fas fa-user-tie"></i></div>
                <div>
                  <p class="text-xs text-slate-500">Tenaga Administrasi</p>
                  <p class="text-xl font-bold text-slate-800">${siteData.administrasi.length} Staf</p>
                </div>
              </div>
              <div class="bg-white p-6 rounded-2xl border border-slate-200/70 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg"><i class="fas fa-trophy"></i></div>
                <div>
                  <p class="text-xs text-slate-500">Pencapaian Siswa</p>
                  <p class="text-xl font-bold text-slate-800">${siteData.prestasi_siswa.length} Prestasi</p>
                </div>
              </div>
              <div class="bg-white p-6 rounded-2xl border border-slate-200/70 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fas fa-flag"></i></div>
                <div>
                  <p class="text-xs text-slate-500">Ekstrakurikuler</p>
                  <p class="text-xl font-bold text-slate-800">${siteData.ekskul.length} Kegiatan</p>
                </div>
              </div>
            </div>
            
            <div class="bg-white rounded-2xl border border-slate-200/70 p-6 shadow-sm">
              <div class="flex items-center justify-between mb-5">
                <h3 class="font-bold text-slate-800">Pengumuman Terbaru</h3>
                <button onclick="navigate('pengumuman')" class="text-xs font-semibold text-indigo-600 hover:underline">Lihat Semua</button>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                ${recentPengumuman.length ? recentPengumuman.map(item => `
                  <div class="p-5 rounded-2xl bg-slate-50 border border-slate-100 space-y-2">
                    <div class="flex items-center justify-between text-[11px] font-semibold">
                      <span class="px-2.5 py-0.5 rounded-md bg-indigo-100 text-indigo-700">${item.kategori || 'INFO'}</span>
                      <span class="text-slate-400">${item.tanggal || ''}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 text-sm">${item.judul}</h4>
                    <p class="text-xs text-slate-600 leading-relaxed">${item.isi}</p>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400">Belum ada pengumuman.</p>'}
              </div>
            </div>
          </div>
        `;
      } 
      else if (page === 'profil') {
        titleEl.textContent = 'Profil Sekolah';
        container.innerHTML = `
          <div class="space-y-8 overflow-hidden">
            <div class="bg-white rounded-3xl border border-slate-200/70 p-6 lg:p-8 shadow-sm opacity-0-init anim-left">
              <h2 class="text-2xl md:text-3xl font-bold text-indigo-700 mb-3">Identitas Sekolah</h2>
              <p class="text-sm md:text-base text-slate-600 leading-relaxed mb-6">
                SMP Negeri 02 Martapura adalah instansi pendidikan menengah pertama berstatus negeri yang berlokasi di Kabupaten OKU Timur, Sumatera Selatan. Kami berkomitmen untuk mencetak generasi berprestasi, berakhlak mulia, dan berwawasan lingkungan.
              </p>
            </div>
            
            <div class="bg-white rounded-3xl border border-slate-200/70 p-6 lg:p-8 shadow-sm opacity-0-init anim-right delay-100">
              <h2 class="text-2xl md:text-3xl font-bold text-indigo-700 mb-3">Profil Kepala Sekolah</h2>
              <p class="text-sm md:text-base text-slate-600 leading-relaxed mb-6">
                Beliau adalah pimpinan yang berdedikasi tinggi dalam memajukan kualitas pendidikan dan karakter siswa di SMP Negeri 02 Martapura. 
                <br><br><strong>Nama:</strong> (Isi Nama Kepala Sekolah)<br><strong>NIP:</strong> (Isi NIP)
              </p>
            </div>
            
            <div class="bg-white rounded-3xl border border-slate-200/70 p-6 lg:p-8 shadow-sm opacity-0-init anim-up delay-200">
              <h2 class="text-2xl md:text-3xl font-bold text-indigo-700 mb-3">Struktur Organisasi</h2>
              <p class="text-sm md:text-base text-slate-600 leading-relaxed mb-6">
                Berikut adalah bagan struktur organisasi serta pembagian tugas di lingkungan SMP Negeri 02 Martapura guna memastikan kelancaran kegiatan operasional dan akademik sekolah.
              </p>
            </div>
            
            <div class="bg-white rounded-3xl border border-slate-200/70 p-6 lg:p-8 shadow-sm opacity-0-init anim-zoom delay-300">
              <h2 class="text-2xl md:text-3xl font-bold text-indigo-700 mb-3">Sarana & Prasarana</h2>
              <p class="text-sm md:text-base text-slate-600 leading-relaxed mb-6">
                Untuk menunjang kegiatan belajar mengajar yang optimal, SMP Negeri 02 Martapura dilengkapi dengan berbagai fasilitas, mulai dari ruang kelas yang nyaman, perpustakaan digital, hingga laboratorium IPA dan Komputer.
              </p>
            </div>
            
            <div class="bg-white rounded-3xl border border-slate-200/70 p-6 lg:p-8 shadow-sm opacity-0-init anim-down delay-400">
              <h2 class="text-2xl md:text-3xl font-bold text-indigo-700 mb-3">Visi & Misi</h2>
              <p class="text-sm md:text-base text-slate-600 leading-relaxed mb-6">
                Visi kami adalah mewujudkan peserta didik yang unggul dalam Imtaq, Iptek, dan berkarakter Profil Pelajar Pancasila.
              </p>
            </div>
          </div>
        `;
      }
      else if (page === 'ptk-guru') {
        titleEl.textContent = 'PTK - Daftar Guru';
        const filtered = siteData.guru.filter(g => g.nama.toLowerCase().includes(kw) || g.mapel.toLowerCase().includes(kw));
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 opacity-0-init anim-up">
            ${filtered.length ? filtered.map(g => `
              <div class="bg-white rounded-2xl border border-slate-200/70 p-6 shadow-sm flex items-center gap-4">
                ${g.foto ? `<img src="${g.foto}" alt="${g.nama}" class="w-16 h-16 rounded-2xl object-cover flex-shrink-0 bg-slate-100" />` : `<div class="w-16 h-16 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl font-bold flex-shrink-0"><i class="fas fa-user"></i></div>`}
                <div class="min-w-0">
                  <span class="inline-block px-2.5 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-[11px] font-semibold mb-1">${g.mapel}</span>
                  <h4 class="font-bold text-slate-800 text-sm truncate">${g.nama}</h4>
                  <p class="text-xs text-slate-400 mt-0.5">${g.nip ? 'NIP. ' + g.nip : 'Tenaga Pendidik'}</p>
                </div>
              </div>
            `).join('') : '<p class="text-sm text-slate-500">Data guru belum tersedia atau tidak ditemukan.</p>'}
          </div>
        `;
      }
      else if (page === 'ptk-admin') {
        titleEl.textContent = 'PTK - Tenaga Administrasi';
        const filtered = siteData.administrasi.filter(a => a.nama.toLowerCase().includes(kw) || a.jabatan.toLowerCase().includes(kw));
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 opacity-0-init anim-up">
            ${filtered.length ? filtered.map(a => `
              <div class="bg-white rounded-2xl border border-slate-200/70 p-6 shadow-sm flex items-center gap-4">
                ${a.foto ? `<img src="${a.foto}" alt="${a.nama}" class="w-16 h-16 rounded-2xl object-cover flex-shrink-0 bg-slate-100" />` : `<div class="w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold flex-shrink-0"><i class="fas fa-user-tie"></i></div>`}
                <div class="min-w-0">
                  <span class="inline-block px-2.5 py-0.5 rounded-md bg-emerald-50 text-emerald-700 text-[11px] font-semibold mb-1">${a.jabatan}</span>
                  <h4 class="font-bold text-slate-800 text-sm truncate">${a.nama}</h4>
                  <p class="text-xs text-slate-400 mt-0.5">Staf Tata Usaha</p>
                </div>
              </div>
            `).join('') : '<p class="text-sm text-slate-500">Data tenaga administrasi belum tersedia.</p>'}
          </div>
        `;
      }
      else if (page === 'siswa-data') {
        titleEl.textContent = 'Siswa - Data & Rombel';
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200/70 p-6 shadow-sm space-y-4 opacity-0-init anim-up">
            <h3 class="font-bold text-slate-800">Rombongan Belajar</h3>
            <p class="text-sm text-slate-600">Informasi rekapitulasi peserta didik aktif SMP Negeri 02 Martapura per tingkat kelas.</p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
              <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200/60"><p class="text-xs font-semibold text-indigo-600">TINGKAT VII</p><p class="text-lg font-bold text-slate-800 mt-1">Kelas VII A – VII F</p></div>
              <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200/60"><p class="text-xs font-semibold text-indigo-600">TINGKAT VIII</p><p class="text-lg font-bold text-slate-800 mt-1">Kelas VIII A – VIII F</p></div>
              <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200/60"><p class="text-xs font-semibold text-indigo-600">TINGKAT IX</p><p class="text-lg font-bold text-slate-800 mt-1">Kelas IX A – IX F</p></div>
            </div>
          </div>
        `;
      }
      else if (page === 'siswa-pencapaian') {
        titleEl.textContent = 'Siswa - Pencapaian & Prestasi';
        const filtered = siteData.prestasi_siswa.filter(p => p.judul.toLowerCase().includes(kw) || p.nama_siswa.toLowerCase().includes(kw));
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 opacity-0-init anim-up">
            ${filtered.length ? filtered.map(p => `
              <div class="bg-white rounded-2xl border border-slate-200/70 p-6 shadow-sm flex flex-col justify-between">
                <div>
                  ${p.foto ? `<img src="${p.foto}" alt="${p.judul}" class="w-full h-48 object-cover rounded-xl mb-4 bg-slate-100" />` : ''}
                  <span class="inline-block px-2.5 py-1 rounded-md bg-amber-50 text-amber-700 text-[11px] font-semibold mb-2">Tingkat ${p.tingkat}</span>
                  <h4 class="font-bold text-slate-800 text-base">${p.judul}</h4>
                  <p class="text-xs text-slate-500 mt-2"><i class="fas fa-user-graduate mr-1.5 text-indigo-500"></i>${p.nama_siswa}</p>
                </div>
              </div>
            `).join('') : '<p class="text-sm text-slate-500">Belum ada data pencapaian siswa.</p>'}
          </div>
        `;
      }
      else if (page === 'ekskul-daftar' || page === 'ekskul-pencapaian') {
        titleEl.textContent = page === 'ekskul-daftar' ? 'Ekstrakurikuler - Daftar & Kegiatan' : 'Ekstrakurikuler - Pencapaian';
        const filtered = siteData.ekskul.filter(e => e.nama.toLowerCase().includes(kw) || e.deskripsi.toLowerCase().includes(kw));
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 opacity-0-init anim-up">
            ${filtered.length ? filtered.map(e => `
              <div class="bg-white rounded-2xl border border-slate-200/70 p-6 shadow-sm">
                ${renderMediaEmbed(e.foto, e.video_url, e.nama)}
                <div class="flex items-center justify-between mb-2">
                  <h4 class="font-bold text-slate-800 text-lg">${e.nama}</h4>
                  <span class="text-xs text-slate-500 bg-slate-100 px-3 py-1 rounded-full">Pembina: ${e.pembina}</span>
                </div>
                <p class="text-sm text-slate-600 leading-relaxed">${e.deskripsi}</p>
              </div>
            `).join('') : '<p class="text-sm text-slate-500">Belum ada data ekstrakurikuler.</p>'}
          </div>
        `;
      }
      else if (page === 'pengumuman') {
        titleEl.textContent = 'Pengumuman Sekolah';
        const filtered = siteData.pengumuman.filter(item => item.judul.toLowerCase().includes(kw) || item.isi.toLowerCase().includes(kw));
        container.innerHTML = `
          <div class="space-y-4 max-w-4xl opacity-0-init anim-up">
            ${filtered.length ? filtered.map(item => `
              <div class="bg-white rounded-2xl border border-slate-200/70 p-6 shadow-sm space-y-2">
                <div class="flex items-center gap-3 text-xs font-semibold">
                  <span class="px-2.5 py-1 rounded-md bg-indigo-50 text-indigo-700">${item.kategori || 'PENGUMUMAN'}</span>
                  <span class="text-slate-400">${item.tanggal || ''}</span>
                </div>
                <h4 class="font-bold text-slate-800 text-base">${item.judul}</h4>
                <p class="text-sm text-slate-600 leading-relaxed">${item.isi}</p>
              </div>
            `).join('') : '<p class="text-sm text-slate-500">Belum ada pengumuman.</p>'}
          </div>
        `;
      }
    }
    
    function handleSearch(keyword) {
      renderPage(currentPage, keyword);
    }
    
    function toggleDropdown(menuId, arrowId) {
      const menu = document.getElementById(menuId);
      const arrow = document.getElementById(arrowId);
      menu.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }
    
    // Fungsi Toggle Sidebar untuk SEMUA layar
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar-menu');
      const overlay = document.getElementById('sidebarOverlay');
      
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }
    
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
    
    document.addEventListener('DOMContentLoaded', loadSchoolData);
  </script>
</body>
</html>
