<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMP Negeri 02 Martapura - Portal Resmi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    #netlify-badge, a[href*="netlify.com"][style*="fixed"] { display: none !important; opacity: 0 !important; visibility: hidden !important; }

    /* CSS GALERI CAROUSEL (Mulus, responsif, tanpa scrollbar bawaan) */
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .carousel-container { scroll-snap-type: x mandatory; scroll-behavior: smooth; }
    .carousel-slide { scroll-snap-align: center; }
  </style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50 text-slate-800">

  <!-- Mobile Sidebar Overlay -->
  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden lg:hidden"></div>

  <!-- Sidebar Navigasi -->
  <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-72 bg-slate-900 text-slate-300 flex flex-col transition-all duration-300 -translate-x-full lg:translate-x-0 shadow-2xl">
    <div class="pt-8 pb-6 px-6 flex items-center gap-3.5 border-b border-slate-800/80">
      <img id="school-logo" src="assets/LOGO SMPN02MPA VERSI 2.png" alt="Logo" class="w-12 h-12 object-contain flex-shrink-0 bg-white/5 rounded-xl p-1" />
      <div class="overflow-hidden">
        <h2 id="school-short-name" class="text-base font-bold tracking-wide text-white truncate">SMPN 02 MPA</h2>
        <p id="school-full-name" class="text-[11px] text-slate-400 leading-tight">SMP Negeri 02 Martapura</p>
      </div>
    </div>

    <div class="px-5 py-4 border-b border-slate-800/80">
      <div class="bg-slate-800/70 rounded-xl px-3.5 py-2.5 flex items-center gap-2.5 border border-slate-700/50 focus-within:border-indigo-500 transition">
        <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
        <input id="searchInput" type="text" onkeyup="handleSearch(this.value)" placeholder="Cari data..." class="bg-transparent text-xs text-white placeholder-slate-400 focus:outline-none w-full" />
      </div>
    </div>

    <nav class="flex-1 px-4 py-5 space-y-1.5 overflow-y-auto sidebar-scroll text-sm">
      <button onclick="navigate('beranda')" data-nav="beranda" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium transition text-left bg-indigo-600 text-white shadow-lg shadow-indigo-600/20"><i class="fas fa-home w-5 text-center"></i><span>Beranda</span></button>
      <button onclick="navigate('profil')" data-nav="profil" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition text-left"><i class="fas fa-school w-5 text-center"></i><span>Profil Sekolah</span></button>
      <div>
        <button onclick="toggleDropdown('dropdown-ptk', 'arrow-ptk')" data-parent="ptk" class="parent-nav w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"><div class="flex items-center gap-3"><i class="fas fa-chalkboard-teacher w-5 text-center"></i><span>PTK</span></div><i id="arrow-ptk" class="fas fa-chevron-down text-xs transition-transform duration-200"></i></button>
        <div id="dropdown-ptk" class="hidden pl-9 pr-2 pt-1 space-y-1">
          <button onclick="navigate('ptk-guru')" data-nav="ptk-guru" data-parent-ref="ptk" class="nav-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/70 transition">Guru</button>
          <button onclick="navigate('ptk-admin')" data-nav="ptk-admin" data-parent-ref="ptk" class="nav-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/70 transition">Tenaga Administrasi</button>
        </div>
      </div>
      <button onclick="navigate('pengumuman')" data-nav="pengumuman" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition text-left"><i class="fas fa-bullhorn w-5 text-center"></i><span>Pengumuman</span></button>
    </nav>

    <div class="p-4 border-t border-slate-800/80">
      <a href="/admin/" class="flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-indigo-600 text-xs font-medium text-slate-300 hover:text-white transition"><i class="fas fa-lock text-[11px]"></i><span>Panel Admin Sekolah</span></a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="bg-white border-b border-slate-200/80 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fas fa-bars text-lg"></i></button>
        <div>
          <h1 id="page-title" class="text-lg font-bold text-slate-800">Beranda</h1>
          <p class="text-xs text-slate-500">Sistem Informasi & Profil SMP Negeri 02 Martapura</p>
        </div>
      </div>
    </header>

    <main id="app-content" class="flex-1 overflow-y-auto p-6 lg:p-8 space-y-6"></main>
  </div>

  <script>
    let siteData = {
      identitas: { nama: "SMP Negeri 02 Martapura", singkatan: "SMPN 02 MPA", logo: "assets/LOGO SMPN02MPA VERSI 2.png", sambutan: "Selamat datang di portal resmi." },
      pengumuman: [], guru: [], administrasi: [],
      profil_sekolah: [] // INI ARRAY DINAMIS BARU DARI ADMIN PANEL
    };
    let currentPage = 'beranda';

    async function loadSchoolData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        if (response.ok) { siteData = { ...siteData, ...await response.json() }; }
      } catch (err) { console.log('Menggunakan data lokal awal.'); }
      
      if (siteData.identitas) {
        document.getElementById('school-short-name').textContent = siteData.identitas.singkatan || 'SMPN 02 MPA';
        document.getElementById('school-full-name').textContent = siteData.identitas.nama || 'SMPN 02 Martapura';
        if (siteData.identitas.logo) document.getElementById('school-logo').src = siteData.identitas.logo;
      }
      renderPage(currentPage);
    }

    // FUNGSI KONTROL CAROUSEL GALERI
    function scrollCarousel(index, direction) {
      const carousel = document.getElementById(`carousel-${index}`);
      const scrollAmount = carousel.clientWidth;
      carousel.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function updateIndicator(index, total) {
      const carousel = document.getElementById(`carousel-${index}`);
      const currentIndex = Math.round(carousel.scrollLeft / carousel.clientWidth) + 1;
      const indicator = document.getElementById(`indicator-${index}`);
      if(indicator) indicator.textContent = currentIndex;
    }

    function navigate(page) {
      currentPage = page;
      document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg'); el.classList.add(el.dataset.parentRef ? 'text-slate-400' : 'text-slate-300'); });
      document.querySelectorAll('.parent-nav').forEach(el => { el.classList.remove('text-indigo-400', 'bg-slate-800/60'); el.classList.add('text-slate-300'); });
      
      const activeBtn = document.querySelector(`[data-nav="${page}"]`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-300', 'text-slate-400');
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-lg');
        if (activeBtn.dataset.parentRef) document.querySelector(`[data-parent="${activeBtn.dataset.parentRef}"]`).classList.add('text-indigo-400', 'bg-slate-800/60');
      }
      if (window.innerWidth < 1024 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) toggleSidebar();
      renderPage(page);
    }

    function renderPage(page, filterKeyword = '') {
      const container = document.getElementById('app-content');
      const titleEl = document.getElementById('page-title');
      const kw = filterKeyword.toLowerCase();

      if (page === 'beranda') {
        titleEl.textContent = 'Beranda';
        container.innerHTML = `<div class="bg-indigo-950 p-8 rounded-3xl text-white shadow-xl"><h2 class="text-3xl font-bold">${siteData.identitas.nama}</h2><p class="mt-4 text-slate-300">${siteData.identitas.sambutan}</p></div>`;
      } 
      
      // HALAMAN PROFIL DINAMIS TERHUBUNG CMS
      else if (page === 'profil') {
        titleEl.textContent = 'Profil & Galeri Sekolah';
        
        // Cek apakah admin sudah membuat panel di CMS
        if (!siteData.profil_sekolah || siteData.profil_sekolah.length === 0) {
          container.innerHTML = `<p class="text-sm text-slate-500 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">Belum ada panel profil. Silakan tambah melalui Panel Admin.</p>`;
          return;
        }

        // Render Panel Dinamis Loop
        let panelsHTML = siteData.profil_sekolah.map((panel, pIndex) => {
          let galleryHTML = '';
          let controlsHTML = '';

          // Jika panel punya galeri foto
          if (panel.galeri && panel.galeri.length > 0) {
            const total = panel.galeri.length;
            const slides = panel.galeri.map((item) => `
              <div class="carousel-slide w-full flex-shrink-0 relative">
                <img src="${item.foto}" alt="${item.keterangan || panel.judul}" class="w-full h-64 md:h-80 object-cover object-center bg-slate-100" />
                ${item.keterangan ? `<div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-4 pt-10 text-white text-sm font-medium leading-relaxed">${item.keterangan}</div>` : ''}
              </div>
            `).join('');

            // Panah dan Indikator (Hanya muncul jika foto > 1)
            if (total > 1) {
              controlsHTML = `
                <button onclick="scrollCarousel(${pIndex}, -1)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white w-9 h-9 rounded-full flex items-center justify-center transition backdrop-blur-sm z-10"><i class="fas fa-chevron-left text-sm"></i></button>
                <button onclick="scrollCarousel(${pIndex}, 1)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white w-9 h-9 rounded-full flex items-center justify-center transition backdrop-blur-sm z-10"><i class="fas fa-chevron-right text-sm"></i></button>
                <div class="absolute top-3 right-3 bg-black/60 text-white text-xs font-bold px-3 py-1 rounded-full backdrop-blur-sm z-10"><span id="indicator-${pIndex}">1</span> / ${total}</div>
              `;
            }

            galleryHTML = `
              <div class="relative group rounded-t-2xl overflow-hidden bg-slate-100">
                <div id="carousel-${pIndex}" class="carousel-container flex overflow-x-auto hide-scroll w-full h-full" onscroll="updateIndicator(${pIndex}, ${total})">
                  ${slides}
                </div>
                ${controlsHTML}
              </div>
            `;
          }

          return `
            <div class="bg-white rounded-2xl border border-slate-200/70 shadow-sm flex flex-col mb-8 overflow-hidden">
              ${galleryHTML}
              <div class="p-6 md:p-8 space-y-4">
                <h3 class="font-bold text-xl text-indigo-800 border-b border-slate-100 pb-3">${panel.judul}</h3>
                <div class="text-sm text-slate-700 leading-relaxed max-w-none whitespace-pre-wrap">${panel.deskripsi || ''}</div>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200/70 p-6 shadow-sm flex flex-wrap items-center gap-5 mb-8">
            <img src="${siteData.identitas.logo}" alt="Logo" class="w-16 h-16 object-contain" />
            <div>
              <h2 class="text-xl font-bold text-slate-800">${siteData.identitas.nama}</h2>
              <p class="text-sm text-slate-500">Profil & Fasilitas</p>
            </div>
          </div>
          ${panelsHTML}
        `;
      }
      
      // Halaman lainnya tetap disingkat untuk fokus pada profil...
      else {
        container.innerHTML = `<p class="p-4 bg-white rounded-xl shadow-sm">Halaman ${page} siap digunakan.</p>`;
      }
    }

    function toggleDropdown(m, a) { document.getElementById(m).classList.toggle('hidden'); document.getElementById(a).classList.toggle('rotate-180'); }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebarOverlay').classList.toggle('hidden'); }
    if (window.netlifyIdentity) { window.netlifyIdentity.on("init", user => { if (!user) window.netlifyIdentity.on("login", () => document.location.href = "/admin/"); }); }
    document.addEventListener('DOMContentLoaded', loadSchoolData);
  </script>
</body>
</html>
